name: Check licenses

on: [pull_request, push]

jobs:
  licenses:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Regenerate licenses
        run: ./gradlew :app:generateLicenses --no-daemon --rerun
      - name: Fail if app/src/main/assets/licenses.json is out of date
        run: |
          if ! git diff --exit-code -- app/src/main/assets/licenses.json; then
            echo "::error::app/src/main/assets/licenses.json is out of date. Run './gradlew :app:generateLicenses' and commit the result."
            exit 1
          fi
